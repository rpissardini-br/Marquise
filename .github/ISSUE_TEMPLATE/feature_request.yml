name: Feature request
description: An idea for Marquise.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What would you like to do?
      description: The situation or problem, more than the solution. For example, "During calls I lose my place when…"
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: How could Marquise help?
  - type: textarea
    id: alternatives
    attributes:
      label: How do you handle it today?
